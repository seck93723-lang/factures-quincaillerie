<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factures Quincaillerie</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--blue:#1f6fd1;--blue2:#e8f1fc;--ink:#14213d;--muted:#6b7280;--bg:#f4f6fa;--card:#fff;--line:#d9e3f2;--red:#c62828;--green:#1b8a4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{background:var(--blue);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
header small{opacity:.85}
nav{display:flex;gap:6px;margin-top:10px}
nav button{flex:1;border:0;border-radius:10px;padding:9px 4px;font-size:14px;font-weight:600;background:rgba(255,255,255,.18);color:#fff}
nav button.on{background:#fff;color:var(--blue)}
main{padding:14px 16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:600}
input,textarea{width:100%;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fbfdff}
.line .top{display:flex;gap:8px;align-items:center}
.line .q{width:70px;flex:none}
.line .tot{font-weight:700;text-align:right;margin-top:6px;color:var(--blue)}
.x{border:0;background:#fdecec;color:var(--red);border-radius:8px;width:36px;height:40px;font-size:18px;flex:none}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;margin-top:8px;background:var(--blue);color:#fff}
.btn.light{background:var(--blue2);color:var(--blue)}
.btn.green{background:#25d366;color:#fff}
.btn.red{background:#fdecec;color:var(--red)}
.grand{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:6px 0}
.sub{display:flex;justify-content:space-between;color:var(--muted);margin:4px 0}
.words{font-size:13px;color:var(--muted);font-style:italic}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.item b{display:block}.item small{color:var(--muted)}
.amt{font-weight:800;text-align:right;white-space:nowrap}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:700}
.paid{background:#e5f6ec;color:var(--green)}.due{background:#fdecec;color:var(--red)}
.hidden{display:none!important}
.stats{display:flex;gap:8px;margin-bottom:12px}.stats div{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:16px}.stats small{color:var(--muted);font-size:11px}
#toast{position:fixed;left:16px;right:16px;bottom:24px;background:#14213d;color:#fff;padding:14px 16px;border-radius:12px;font-weight:600;text-align:center;z-index:50;opacity:0;transform:translateY(20px);transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:none}
#toast.err{background:var(--red)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#modal .box{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 26px}
#modal h3{margin:0 0 6px;font-size:17px}
#modal p{margin:0 0 6px;color:var(--muted);font-size:14px}
#warn{background:#fff4e5;color:#8a4b00;padding:10px 14px;font-size:13px;font-weight:600}
/* ===== Facture papier ===== */
#sheetWrap{overflow-x:auto}
.sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;padding:18px 16px;color:#1a3f8f;font-family:Arial,Helvetica,sans-serif;border:1px solid #dfe7f5}
.sh-name{font-size:21px;font-weight:900;text-align:center;letter-spacing:.3px;line-height:1.15}
.sh-sub{display:inline-block;background:#1f6fd1;color:#fff;border-radius:18px;padding:3px 16px;font-weight:800;font-size:15px;margin:6px 0}
.sh-c{text-align:center}
.sh-line{font-size:13px;margin:2px 0}
.sh-meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;font-size:13px}
.sh-fact{font-size:18px;font-weight:900}
.sh-num{color:#c62828;font-weight:800;font-size:16px}
.sh-client{border-bottom:1px dotted #1a3f8f;padding:6px 0 2px;margin:10px 0 8px;font-size:15px;color:#111}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#e8f1fc;border:1px solid #1f6fd1;padding:5px 4px;font-size:11px;text-transform:uppercase}
table.t td{border:1px solid #9dbbe6;padding:5px 4px;color:#111}
table.t td.n{text-align:right;white-space:nowrap}
table.t td.c{text-align:center}
table.t tr.total td{font-weight:900;border:1.5px solid #1f6fd1;color:#1a3f8f;font-size:14px}
.sh-words{margin-top:10px;font-size:12.5px;color:#111}
.sh-pay{margin-top:6px;font-size:13px;color:#111}
.sh-sign{display:flex;justify-content:space-between;margin-top:28px;font-size:12px}
@media print{
  body{background:#fff;padding:0}
  header,#warn,#toast,#modal,main>*:not(#viewPreview),#viewPreview>*:not(#sheetWrap){display:none!important}
  #viewPreview{display:block!important}
  main{padding:0;max-width:none}
  .sheet{border:0;max-width:none}
  @page{margin:10mm}
}
</style>
</head>
<body>
<header>
  <h1 id="hName">Factures</h1>
  <small id="hSub"></small>
  <nav>
    <button data-v="edit" class="on">➕ Facture</button>
    <button data-v="list">📋 Liste</button>
    <button data-v="settings">⚙️ Réglages</button>
  </nav>
</header>
<div id="warn" class="hidden">⚠️ Ici les factures ne peuvent pas être gardées en mémoire. Ouvre l'app avec son lien (ou dans Safari) pour tout enregistrer.</div>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="box"><h3 id="mTitle"></h3><p id="mText"></p><div id="mBtns"></div></div></div>

<main>
<!-- ===== Éditeur ===== -->
<section id="viewEdit">
  <div class="card">
    <div class="row">
      <div><label>N° facture</label><input id="fNum" inputmode="numeric"></div>
      <div><label>Date</label><input id="fDate" type="date"></div>
    </div>
    <label>Client (M.)</label><input id="fClient" placeholder="Nom du client">
    <label>Téléphone client</label><input id="fTel" type="tel" placeholder="77 000 00 00">
  </div>

  <div class="card">
    <div style="font-weight:800;margin-bottom:8px">Articles</div>
    <div id="lines"></div>
    <button class="btn light" id="addLine">+ Ajouter un article</button>
  </div>

  <div class="card">
    <div class="grand"><span>TOTAL</span><span id="gTotal">0 F</span></div>
    <div class="words" id="gWords"></div>
    <div class="row" style="margin-top:8px">
      <div><label>Avance payée</label><input id="fAvance" inputmode="numeric" placeholder="0"></div>
      <div><label>Reste à payer</label><input id="fReste" disabled></div>
    </div>
    <button class="btn" id="save">💾 Enregistrer</button>
    <button class="btn light" id="preview">🧾 Voir / Imprimer</button>
    <button class="btn light" id="newBtn">🆕 Nouvelle facture vide</button>
  </div>
</section>

<!-- ===== Aperçu ===== -->
<section id="viewPreview" class="hidden">
  <div id="sheetWrap"><div class="sheet" id="sheet"></div></div>
  <button class="btn" id="pdf">📄 PDF — imprimer / enregistrer / envoyer</button>
  <button class="btn green" id="shareImg">📤 Envoyer la facture (image)</button>
  <button class="btn green" id="wa">💬 Envoyer sur WhatsApp (texte)</button>
  <button class="btn light" id="back">✏️ Modifier</button>
</section>

<!-- ===== Liste ===== -->
<section id="viewList" class="hidden">
  <div class="stats">
    <div><b id="sCount">0</b><small>Factures</small></div>
    <div><b id="sTotal">0</b><small>Total vendu</small></div>
    <div><b id="sDue">0</b><small>Reste dû</small></div>
  </div>
  <input id="search" placeholder="🔍 Chercher client, n°, téléphone…">
  <div id="list" style="margin-top:10px"></div>
</section>

<!-- ===== Réglages ===== -->
<section id="viewSettings" class="hidden">
  <div class="card">
    <div style="font-weight:800">En-tête de la facture</div>
    <label>Nom de la quincaillerie</label><input id="sName">
    <label>Sous-titre</label><input id="sSub">
    <label>Activité</label><input id="sAct">
    <label>Téléphones</label><input id="sTel">
    <label>Adresse</label><input id="sAdr">
    <label>Prochain numéro de facture</label><input id="sNext" inputmode="numeric">
    <button class="btn" id="saveSettings">Enregistrer les réglages</button>
  </div>
  <div class="card">
    <div style="font-weight:800">Sauvegarde</div>
    <button class="btn light" id="exportBtn">⬇️ Exporter toutes les factures</button>
    <label>Importer une sauvegarde</label><input type="file" id="importFile" accept=".json,application/json">
  </div>
</section>
</main>

<datalist id="articles"></datalist>

<script>
const KEY='factures_quincaillerie_v1';
let CAN_STORE=false;
try{localStorage.setItem('__t','1');CAN_STORE=localStorage.getItem('__t')==='1';localStorage.removeItem('__t');}catch(e){CAN_STORE=false;}
const store={get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v));return true}catch(e){return false}}};

/* ---- Messages (sans alert/confirm/prompt, bloqués dans certains aperçus) ---- */
let toastT;
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='on'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2800);}
function modal(title,text,buttons){const m=document.getElementById('modal');document.getElementById('mTitle').textContent=title;document.getElementById('mText').textContent=text||'';
  const b=document.getElementById('mBtns');b.innerHTML='';
  buttons.concat([{t:'Annuler',c:'light'}]).forEach(x=>{const el=document.createElement('button');el.className='btn '+(x.c||'');el.textContent=x.t;el.onclick=()=>{m.classList.add('hidden');x.f&&x.f();};b.appendChild(el);});
  m.classList.remove('hidden');}
function ask(title,text,okText,f){modal(title,text,[{t:okText,c:'red',f}]);}

const DEFAULT={
  settings:{name:'QUINCAILLERIE TOUBA DAROU KHOUDOSS',sub:'GNINGUE & FRÈRES',act:'Vente de tout matériel de construction',tel:'77 134 65 86 - 76 562 83 78',adr:'Touba 28',next:454},
  invoices:[{id:'ex453',num:453,date:'2026-10-03',client:'Bay Diop Sagata',tel:'',avance:0,lines:[
    {q:1,d:'Colle porte plastique',pu:7000},{q:1,d:'Pot Tama Bing',pu:7500},{q:5,d:'Niveau 60 Bing',pu:2000},
    {q:4,d:'Rouleau fil 1,5',pu:21500},{q:20,d:'Mètre fil TH',pu:1000},{q:10,d:'Tuyau 25',pu:1700},
    {q:2,d:'Paquet prise Ingelec',pu:6000},{q:50,d:'Boîte simple',pu:60},{q:10,d:'Lampe 28',pu:1000},
    {q:10,d:'Lampe 18',pu:700},{q:5,d:'Tuyau PVC 110',pu:6500},{q:2,d:'Poutrelle galva',pu:6500},
    {q:10,d:'Robinet 27 déc',pu:1750},{q:1,d:'Pot téflon',pu:4000},{q:50,d:'Lampe 9W',pu:350},
    {q:2,d:'Fil de fer noir',pu:10000},{q:5,d:'Coude PVC',pu:2750}]}]
};
let S=store.get()||JSON.parse(JSON.stringify(DEFAULT));
let cur=null;
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(n)||0).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ');
const num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0;
const pad=n=>String(n).padStart(6,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const frDate=s=>s?s.split('-').reverse().join('/'):'';
const total=inv=>inv.lines.reduce((a,l)=>a+num(l.q)*num(l.pu),0);
function save(){const ok=store.set(S);cloudSet('settings',{settings:S.settings});return ok}
/* ---- Sauvegarde en ligne (quand l'app est ouverte avec son lien) ---- */
let CLOUD=null,DL=null;
function cloudSet(k,v){if(!CLOUD)return;CLOUD.doc(k).set(JSON.parse(JSON.stringify(v))).catch(()=>{});}
function cloudDel(k){if(!CLOUD)return;CLOUD.doc(k).delete().catch(()=>{});}
function saveInv(inv){store.set(S);cloudSet('inv_'+inv.id,{inv});cloudSet('settings',{settings:S.settings});}
function delInv(inv){store.set(S);cloudDel('inv_'+inv.id);}
async function initCloud(){if(!window.claude||!claude.use)return;
  try{DL=await claude.use('downloads');}catch(e){}
  try{const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;const uid=await user.id();if(!uid)return;
    const col=db.collection('data/users/'+uid);const snap=await col.get();CLOUD=col;
    const docs=snap.docs.filter(d=>d.exists);
    if(docs.length){const st=docs.find(d=>d.id==='settings');const invs=docs.filter(d=>d.id.startsWith('inv_')).map(d=>JSON.parse(JSON.stringify(d.data().inv)));
      if(st)S.settings=JSON.parse(JSON.stringify(st.data().settings));S.invoices=invs;store.set(S);
      header();buildCatalog();if(!cur||cur.isNew)load(blank());if(!$('viewList').classList.contains('hidden'))renderList();}
    else{cloudSet('settings',{settings:S.settings});S.invoices.forEach(i=>cloudSet('inv_'+i.id,{inv:i}));}
    $('warn').classList.add('hidden');
  }catch(e){CLOUD=null;}}

/* ---- Nombre en lettres ---- */
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
const T=['','dix','vingt','trente','quarante','cinquante','soixante'];
function b100(n){if(n<17)return U[n];if(n<20)return'dix-'+U[n-10];const t=Math.floor(n/10),u=n%10;
  if(t===7)return n===71?'soixante-et-onze':'soixante-'+b100(n-60);
  if(t===8)return u?'quatre-vingt-'+U[u]:'quatre-vingts';
  if(t===9)return'quatre-vingt-'+b100(n-80);
  if(!u)return T[t];return T[t]+(u===1?'-et-un':'-'+U[u]);}
function b1000(n){const h=Math.floor(n/100),r=n%100;let s='';if(h)s=h===1?'cent':U[h]+'-cent'+(r===0?'s':'');if(r)s+=(s?'-':'')+b100(r);return s;}
function words(n){n=Math.round(n);if(!n)return'zéro';const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000,p=[];
  if(m)p.push(b1000(m)+(m>1?'-millions':'-million'));
  if(k)p.push(k===1?'mille':b1000(k).replace(/cents$/,'cent').replace(/vingts$/,'vingt')+'-mille');
  if(r)p.push(b1000(r));return p.join('-');}

/* ---- Navigation ---- */
function show(v){['edit','list','settings','preview'].forEach(x=>$('view'+x[0].toUpperCase()+x.slice(1)).classList.toggle('hidden',x!==v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='preview'&&b.dataset.v==='edit')));
  if(v==='list')renderList();if(v==='settings')loadSettings();window.scrollTo(0,0);}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));

function header(){$('hName').textContent=S.settings.name;$('hSub').textContent=S.settings.sub+' · Factures';}

/* ---- Éditeur ---- */
function blank(){return{id:'f'+Date.now(),num:S.settings.next,date:today(),client:'',tel:'',avance:0,lines:[{q:1,d:'',pu:''}],isNew:true}}
function load(inv){cur=JSON.parse(JSON.stringify(inv));$('fNum').value=cur.num;$('fDate').value=cur.date;$('fClient').value=cur.client;$('fTel').value=cur.tel;$('fAvance').value=cur.avance||'';renderLines();}
function renderLines(){
  $('lines').innerHTML=cur.lines.map((l,i)=>`<div class="line" data-i="${i}">
    <div class="top"><input class="q" data-k="q" inputmode="decimal" placeholder="Qté" value="${esc(l.q)}">
    <input data-k="d" list="articles" placeholder="Désignation" value="${esc(l.d)}">
    <button class="x" data-del="${i}">×</button></div>
    <div class="top" style="margin-top:6px"><input data-k="pu" inputmode="numeric" placeholder="Prix unitaire" value="${esc(l.pu)}">
    <div class="tot" style="flex:1" id="lt${i}">${fmt(num(l.q)*num(l.pu))} F</div></div></div>`).join('');
  totals();}
$('lines').addEventListener('input',e=>{const box=e.target.closest('.line');if(!box)return;const i=+box.dataset.i,k=e.target.dataset.k;cur.lines[i][k]=e.target.value;
  if(k==='d'){const p=priceOf(e.target.value);const puIn=box.querySelector('[data-k=pu]');if(p&&!puIn.value){puIn.value=p;cur.lines[i].pu=p;}}
  $('lt'+i).textContent=fmt(num(cur.lines[i].q)*num(cur.lines[i].pu))+' F';totals();});
$('lines').addEventListener('click',e=>{const d=e.target.dataset.del;if(d===undefined)return;cur.lines.splice(+d,1);if(!cur.lines.length)cur.lines.push({q:1,d:'',pu:''});renderLines();});
$('addLine').onclick=()=>{cur.lines.push({q:1,d:'',pu:''});renderLines();const ins=$('lines').querySelectorAll('[data-k=d]');ins[ins.length-1].focus();};
function totals(){const t=total(cur),a=num($('fAvance').value);$('gTotal').textContent=fmt(t)+' F';$('gWords').textContent=words(t)+' francs CFA';$('fReste').value=fmt(Math.max(t-a,0))+' F';}
$('fAvance').oninput=totals;
function collect(){cur.num=parseInt($('fNum').value)||cur.num;cur.date=$('fDate').value;cur.client=$('fClient').value.trim();cur.tel=$('fTel').value.trim();cur.avance=num($('fAvance').value);
  cur.lines=cur.lines.filter(l=>String(l.d).trim()||num(l.pu));if(!cur.lines.length)cur.lines=[{q:1,d:'',pu:''}];}
function commit(){collect();if(!cur.client){toast('Écris le nom du client.',true);$('fClient').focus();return false;}
  const wasNew=cur.isNew;delete cur.isNew;const i=S.invoices.findIndex(x=>x.id===cur.id);
  if(i>=0)S.invoices[i]=JSON.parse(JSON.stringify(cur));else S.invoices.unshift(JSON.parse(JSON.stringify(cur)));
  if(wasNew||cur.num>=S.settings.next)S.settings.next=Math.max(S.settings.next,cur.num+1);saveInv(cur);buildCatalog();return true;}
$('save').onclick=()=>{if(commit()){(CAN_STORE||CLOUD)?toast('Facture N° '+pad(cur.num)+' enregistrée ✅'):toast('Enregistrée pour cette session seulement ⚠️',true);}};
$('preview').onclick=()=>{if(commit()){renderSheet();show('preview');}};
$('newBtn').onclick=()=>{load(blank());};
$('back').onclick=()=>show('edit');

/* ---- Catalogue des articles (prix retenus) ---- */
let CAT={};
function buildCatalog(){CAT={};S.invoices.slice().reverse().forEach(inv=>inv.lines.forEach(l=>{if(String(l.d).trim())CAT[l.d.trim().toLowerCase()]={d:l.d.trim(),pu:l.pu};}));
  $('articles').innerHTML=Object.values(CAT).map(c=>`<option value="${esc(c.d)}">${fmt(num(c.pu))} F</option>`).join('');}
function priceOf(d){const c=CAT[String(d).trim().toLowerCase()];return c?c.pu:'';}

/* ---- Facture papier ---- */
function renderSheet(){const s=S.settings,t=total(cur),rest=Math.max(t-num(cur.avance),0);
  $('sheet').innerHTML=`<div class="sh-c"><div class="sh-name">${esc(s.name)}</div><div class="sh-sub">${esc(s.sub)}</div>
  <div class="sh-line" style="font-weight:700">${esc(s.act)}</div><div class="sh-line"><b>Tél : ${esc(s.tel)}</b></div><div class="sh-line">Adresse : ${esc(s.adr)}</div></div>
  <div class="sh-meta"><div class="sh-fact">FACTURE</div><div style="text-align:right">Date : <b style="color:#111">${frDate(cur.date)}</b><br><span class="sh-num">N° ${pad(cur.num)}</span></div></div>
  <div class="sh-client">M. <b>${esc(cur.client)}</b>${cur.tel?' &nbsp;·&nbsp; Tél : '+esc(cur.tel):''}</div>
  <table class="t"><tr><th style="width:12%">Qté</th><th>Désignation</th><th style="width:20%">P. Unit</th><th style="width:22%">P. Total</th></tr>
  ${cur.lines.map(l=>`<tr><td class="c">${esc(l.q)}</td><td>${esc(l.d)}</td><td class="n">${fmt(num(l.pu))}</td><td class="n">${fmt(num(l.q)*num(l.pu))}</td></tr>`).join('')}
  <tr class="total"><td colspan="3" style="text-align:right">TOTAL</td><td class="n">${fmt(t)} F</td></tr></table>
  <div class="sh-words">Arrêtée la présente facture à la somme de : <b>${words(t)} francs CFA</b></div>
  ${num(cur.avance)?`<div class="sh-pay">Avance : <b>${fmt(cur.avance)} F</b> &nbsp;—&nbsp; Reste à payer : <b>${fmt(rest)} F</b></div>`:''}
  <div class="sh-sign"><span>Le client</span><span>${esc(s.sub)}</span></div>`;}

async function shareFile(blob,name,title){
  if(DL){try{await DL.save({filename:name,data:blob});return;}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return;}}
  const f=new File([blob],name,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return;}}catch(e){if(e.name==='AbortError')return;}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>{try{window.open(url,'_blank')}catch(e){}},300);}
/* ---- Dessin de la facture sur un canvas (fiable sur iPhone, sans capture d'écran) ---- */
function drawInvoice(){const s=S.settings,inv=cur,t=total(inv),rest=Math.max(t-num(inv.avance),0);
  const W=1240,M=60,BLUE='#1f6fd1',DARK='#1a3f8f',INK='#111';
  const cols=[M,M+120,W-M-420,W-M-210,W-M];
  const c=document.createElement('canvas'),x=c.getContext('2d');
  const font=(sz,b)=>x.font=(b?'bold ':'')+sz+'px Arial, Helvetica, sans-serif';
  const fit=(txt,max,sz,b)=>{font(sz,b);while(x.measureText(txt).width>max&&sz>14){sz--;font(sz,b);}return sz;};
  const wrap=(txt,max)=>{const w=String(txt).split(' '),out=[];let l='';w.forEach(wd=>{const tt=l?l+' '+wd:wd;if(x.measureText(tt).width>max&&l){out.push(l);l=wd;}else l=tt;});if(l)out.push(l);return out;};
  font(26);const wl=wrap('Arrêtée la présente facture à la somme de : '+words(t)+' francs CFA',W-2*M);
  const RH=54,H=420+RH*(inv.lines.length+2)+wl.length*36+(num(inv.avance)?50:0)+150;
  c.width=W;c.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='middle';
  let y=60;x.textAlign='center';x.fillStyle=DARK;fit(s.name,W-2*M,50,true);x.fillText(s.name,W/2,y);
  y+=62;font(30,true);const sw=x.measureText(s.sub).width+60;x.fillStyle=BLUE;
  x.beginPath();x.roundRect?x.roundRect(W/2-sw/2,y-24,sw,48,24):x.rect(W/2-sw/2,y-24,sw,48);x.fill();x.fillStyle='#fff';x.fillText(s.sub,W/2,y+1);
  y+=52;x.fillStyle=DARK;font(26,true);x.fillText(s.act,W/2,y);y+=36;x.fillText('Tél : '+s.tel,W/2,y);y+=34;font(25);x.fillText('Adresse : '+s.adr,W/2,y);
  y+=60;x.textAlign='left';font(38,true);x.fillText('FACTURE',M,y);x.textAlign='right';font(26);x.fillStyle=INK;x.fillText('Date : '+frDate(inv.date),W-M,y-18);
  x.fillStyle='#c62828';font(32,true);x.fillText('N° '+pad(inv.num),W-M,y+20);
  y+=66;x.textAlign='left';x.fillStyle=INK;font(30);const cl='M. '+inv.client+(inv.tel?'   ·   Tél : '+inv.tel:'');fit(cl,W-2*M,30);x.fillText(cl,M,y);
  x.strokeStyle=DARK;x.setLineDash([4,5]);x.beginPath();x.moveTo(M,y+24);x.lineTo(W-M,y+24);x.stroke();x.setLineDash([]);
  y+=50;const top=y;
  x.fillStyle='#e8f1fc';x.fillRect(M,y,W-2*M,RH);x.fillStyle=DARK;font(22,true);
  ['QTÉ','DÉSIGNATION','P. UNIT','P. TOTAL'].forEach((h,i)=>{x.textAlign='center';x.fillText(h,(cols[i]+cols[i+1])/2,y+RH/2);});
  y+=RH;x.fillStyle=INK;
  inv.lines.forEach(l=>{const m=y+RH/2;x.textAlign='center';font(26);x.fillText(String(l.q),(cols[0]+cols[1])/2,m);
    x.textAlign='left';fit(String(l.d),cols[2]-cols[1]-24,26);x.fillText(String(l.d),cols[1]+12,m);
    x.textAlign='right';font(26);x.fillText(fmt(num(l.pu)),cols[3]-12,m);x.fillText(fmt(num(l.q)*num(l.pu)),cols[4]-12,m);y+=RH;});
  x.fillStyle=DARK;font(30,true);x.textAlign='right';x.fillText('TOTAL',cols[3]-12,y+RH/2);x.fillText(fmt(t)+' F',cols[4]-12,y+RH/2);y+=RH;
  x.strokeStyle='#9dbbe6';x.lineWidth=2;for(let r=top;r<=y;r+=RH){x.beginPath();x.moveTo(M,r);x.lineTo(W-M,r);x.stroke();}
  cols.forEach((cx,i)=>{x.beginPath();x.moveTo(cx,top);x.lineTo(cx,i>0&&i<3?y-RH:y);x.stroke();});
  x.strokeStyle=BLUE;x.lineWidth=3;x.strokeRect(M,top,W-2*M,y-top);x.strokeRect(M,y-RH,W-2*M,RH);
  y+=40;x.textAlign='left';x.fillStyle=INK;font(26);wl.forEach(l=>{x.fillText(l,M,y);y+=36;});
  if(num(inv.avance)){y+=8;font(27,true);x.fillText('Avance : '+fmt(inv.avance)+' F   —   Reste à payer : '+fmt(rest)+' F',M,y);y+=42;}
  y+=70;font(24);x.fillText('Le client',M,y);x.textAlign='right';x.fillText(s.sub,W-M,y);
  return c;}
function invoiceBlob(type){return new Promise(r=>drawInvoice().toBlob(r,type,0.95));}
$('pdf').onclick=async()=>{if(!window.jspdf){toast('Il faut internet pour créer le PDF. Envoie l\'image à la place.',true);return;}
  try{const c=drawInvoice();const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});
    const img=c.toDataURL('image/jpeg',0.95),Wm=190,Hm=c.height*Wm/c.width,PH=277;
    pdf.addImage(img,'JPEG',10,10,Wm,Hm);let left=Hm-PH,pos=10;while(left>0){pos-=PH;pdf.addPage();pdf.addImage(img,'JPEG',10,pos,Wm,Hm);left-=PH;}
    await shareFile(pdf.output('blob'),'Facture-'+pad(cur.num)+'.pdf','Facture N° '+pad(cur.num));
  }catch(e){toast('Impossible de créer le PDF ici.',true);}};

function waNumber(t){let d=String(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9&&/^[73]/.test(d))d='221'+d;return d;}
$('wa').onclick=()=>{const s=S.settings,t=total(cur),rest=Math.max(t-num(cur.avance),0);
  let m=`*${s.name}*\n${s.sub} — Tél : ${s.tel}\n\n*FACTURE N° ${pad(cur.num)}* du ${frDate(cur.date)}\nClient : ${cur.client}\n\n`;
  m+=cur.lines.map(l=>`${l.q} × ${l.d} — ${fmt(num(l.pu))} = ${fmt(num(l.q)*num(l.pu))} F`).join('\n');
  m+=`\n\n*TOTAL : ${fmt(t)} F CFA*`;if(num(cur.avance))m+=`\nAvance : ${fmt(cur.avance)} F\nReste : ${fmt(rest)} F`;m+=`\n\nMerci pour votre confiance 🙏`;
  const n=waNumber(cur.tel);window.open('https://wa.me/'+(n||'')+'?text='+encodeURIComponent(m),'_blank');};
$('shareImg').onclick=async()=>{try{const b=await invoiceBlob('image/png');await shareFile(b,'Facture-'+pad(cur.num)+'.png','Facture N° '+pad(cur.num));}catch(e){toast('Impossible de créer l\'image ici.',true);}};

/* ---- Liste ---- */
function renderList(){const q=$('search').value.trim().toLowerCase();
  const items=S.invoices.filter(i=>!q||[i.client,i.tel,String(i.num),pad(i.num)].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.num-a.num);
  $('sCount').textContent=S.invoices.length;$('sTotal').textContent=fmt(S.invoices.reduce((a,i)=>a+total(i),0));
  $('sDue').textContent=fmt(S.invoices.reduce((a,i)=>a+Math.max(total(i)-num(i.avance),0),0));
  $('list').innerHTML=items.length?items.map(i=>{const t=total(i),r=Math.max(t-num(i.avance),0);
    return`<div class="item" data-id="${i.id}"><div><b>N° ${pad(i.num)} · ${esc(i.client)}</b><small>${frDate(i.date)} · ${i.lines.length} articles</small></div>
    <div class="amt">${fmt(t)} F<br><span class="tag ${r?'due':'paid'}">${r?'Reste '+fmt(r):'Payée'}</span></div></div>`}).join('')
    :'<p style="text-align:center;color:#6b7280">Aucune facture</p>';}
$('search').oninput=renderList;
$('list').onclick=e=>{const it=e.target.closest('.item');if(!it)return;const inv=S.invoices.find(x=>x.id===it.dataset.id);
  modal('Facture N° '+pad(inv.num),inv.client+' — '+fmt(total(inv))+' F',[
    {t:'🧾 Voir / PDF / envoyer',f:()=>{load(inv);renderSheet();show('preview');}},
    {t:'✏️ Modifier',c:'light',f:()=>{load(inv);show('edit');}},
    {t:'✅ Marquer payée',c:'light',f:()=>{inv.avance=total(inv);saveInv(inv);renderList();toast('Facture payée ✅');}},
    {t:'📑 Copier pour un autre client',c:'light',f:()=>{const c=JSON.parse(JSON.stringify(inv));c.id='f'+Date.now();c.num=S.settings.next;c.date=today();c.client='';c.tel='';c.avance=0;c.isNew=true;load(c);show('edit');}},
    {t:'🗑️ Supprimer',c:'red',f:()=>ask('Supprimer ?','La facture N° '+pad(inv.num)+' sera effacée.','Oui, supprimer',()=>{S.invoices=S.invoices.filter(x=>x.id!==inv.id);delInv(inv);renderList();toast('Facture supprimée');})}
  ]);};

/* ---- Réglages ---- */
function loadSettings(){const s=S.settings;$('sName').value=s.name;$('sSub').value=s.sub;$('sAct').value=s.act;$('sTel').value=s.tel;$('sAdr').value=s.adr;$('sNext').value=s.next;}
$('saveSettings').onclick=()=>{Object.assign(S.settings,{name:$('sName').value,sub:$('sSub').value,act:$('sAct').value,tel:$('sTel').value,adr:$('sAdr').value,next:parseInt($('sNext').value)||S.settings.next});
  save();header();if(cur&&cur.isNew){cur.num=S.settings.next;$('fNum').value=cur.num;}toast('Réglages enregistrés ✅');};
$('exportBtn').onclick=()=>shareFile(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'sauvegarde-factures-'+today()+'.json','Sauvegarde factures');
$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d.invoices||!d.settings)throw 0;}catch(x){toast('Fichier non valide',true);return;}
  ask('Importer ?','Les données actuelles seront remplacées par cette sauvegarde.','Oui, importer',()=>{const old=S.invoices;S=d;save();old.forEach(i=>cloudDel('inv_'+i.id));S.invoices.forEach(i=>cloudSet('inv_'+i.id,{inv:i}));header();buildCatalog();load(blank());toast('Sauvegarde importée ✅');show('list');});};r.readAsText(f);};

header();buildCatalog();load(blank());
if(!CAN_STORE)$('warn').classList.remove('hidden');
initCloud();
</script>
